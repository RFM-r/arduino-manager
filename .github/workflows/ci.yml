name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install CGO/OpenGL deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
      gcc g++ \
      libgl1-mesa-dev \
      xorg-dev \
      libwayland-dev \
      libxkbcommon-dev \
      libx11-dev \
      libxrandr-dev \
      libxcursor-dev \
      libxinerama-dev \
      libxi-dev \
      libxxf86vm-dev
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not formatted:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...
